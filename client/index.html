  <head>    <meta charset="UTF-8" />

    <!-- Preconnect to external domains for faster resource loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Preload hero image for faster LCP -->
    <link rel="preload" as="image" href="/images/doi-inthanon-hero.webp" type="image/webp" />
    <link rel="preload" as="image" href="/images/doi-inthanon-hero.jpg" type="image/jpeg" />
    
    <!-- Optimized font loading with display=swap for better FCP -->
    <link 
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" 
      rel="stylesheet" 
      media="print" 
      onload="this.media='all'" 
    />

      <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <meta name="description" content="Private tours in Chiang Mai for European travelers. Flexible itineraries, local expertise, excellent value." />
    <meta name="keywords" content="Chiang Mai tours, private tours Chiang Mai, Northern Thailand tours, Doi Inthanon, temple tours Thailand, European tours" />
    <meta property="og:title" content="Amporn Tour - Chiang Mai Private Tours" />
    <meta property="og:description" content="Discover Chiang Mai with Amporn Tour. Private, flexible tours for international travelers." />
    <meta property="og:image" content="/images/doi-inthanon-hero.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Amporn Tour | Private Tours in Chiang Mai" />

    <meta name="twitter:image" content="/images/doi-inthanon-hero.jpg" />
    <meta name="theme-color" content="#a35a3a" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="icon" type="image/png" href="/images/amporn-logo.png" />
    <link rel="apple-touch-icon" href="/images/amporn-logo.png" />
    <link rel="canonical" href="https://amporn-tour.manus.space" />

    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <style>
      html[dir="rtl"] {
        direction: rtl;
        text-align: right;
      }
      html[dir="rtl"] * {
        direction: rtl;
      }
    </style>

  <body>
